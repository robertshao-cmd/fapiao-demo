<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>無聊快篩｜發票載具</title>
<script src="qrcode.min.js?v=64cfcc0e"></script>
<script src="unit-kit.js?v=64cfcc0e"></script>
<script>/* 靜態發佈版:回首頁指向同層的殼 */UK.HOME = "../";</script>
<style>
  :root{--ink:#1F2430;--red:#E4001A;--mut:#7A8494;--line:#F0E0E1;--bg:#FFF6F5}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
  .top{position:sticky;top:0;z-index:9;background:var(--red);color:#fff;padding:calc(10px + env(safe-area-inset-top,0)) 8px 10px;display:flex;align-items:center;gap:4px}
  .top b{font-size:16px;flex:1;text-align:center}
  .top button{color:#fff;font-size:21px;font-weight:900;min-width:44px;min-height:44px}
  .top .ttl{font-size:16px;font-weight:800;flex:1;text-align:center;min-width:0}
  .top .off{font-size:9px;background:rgba(255,255,255,.2);padding:2px 7px;border-radius:99px;white-space:nowrap}
  .wrap{max-width:430px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0))}
  .hero{text-align:center;padding:22px 6px 8px}
  .hero .big{font-size:66px;line-height:1}
  .hero h1{font-size:21px;line-height:1.5;margin-top:10px}
  .hero p{font-size:12.5px;color:var(--mut);margin-top:8px}
  .hero.mini{padding:12px 6px 4px} .hero.mini .big{font-size:40px} .hero.mini h1{font-size:16px} .hero.mini p{display:none}
  /* 戲劇化無聊臉:嘆一口氣然後往下沉(reduced-motion 會被下面的 media query 關掉) */
  .face{display:inline-block;animation:sigh 4.4s ease-in-out infinite}
  @keyframes sigh{0%,100%{transform:translateY(0) rotate(-3deg) scale(1)}
    18%{transform:translateY(-3px) rotate(-1deg) scale(1.04)}
    46%{transform:translateY(7px) rotate(3deg) scale(.98)}
    72%{transform:translateY(4px) rotate(1deg) scale(1)}}
  .btn{display:block;width:100%;padding:14px;border-radius:13px;font-size:16px;font-weight:800;text-align:center;margin-top:10px;min-height:50px}
  .btn.p{background:var(--red);color:#fff;box-shadow:0 4px 14px rgba(228,0,26,.28)}
  .btn.p:disabled{opacity:.45;box-shadow:none}
  .card{background:#fff;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(31,36,48,.06)}
  .note{font-size:11px;color:var(--mut);line-height:1.7;margin-top:10px;text-align:center}
  .sec{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
  .sec button{font-size:12.5px;font-weight:800;color:#8A5A5E;text-decoration:underline;text-underline-offset:3px;padding:12px 6px;min-height:44px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .q{font-size:13px;font-weight:800;color:#5A0E14;margin-top:12px}
  .scan{text-align:center;padding:26px 14px 20px;font-size:13.5px;font-weight:800;color:#8A5A5E}
  /* 雷達:你在中間,圈一直往外掃 —— 掃了半天發現你就在原地 */
  .radar{position:relative;width:132px;height:132px;margin:0 auto 14px}
  .radar .ring{position:absolute;inset:0;border:2px solid var(--red);border-radius:50%;
               opacity:0;animation:sweep 1.9s ease-out infinite}
  .radar .r2{animation-delay:.95s}
  .radar .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:40px;
              animation:jiggle 1.9s ease-in-out infinite}
  /* 想跑的那一隻:走出去兩步就被拉回來 */
  .radar .run{position:absolute;left:50%;top:50%;margin-left:-10px;margin-top:-12px;font-size:20px;
              animation:tryRun 1.9s ease-in-out infinite}
  @keyframes sweep{0%{transform:scale(.22);opacity:.9}70%{opacity:.35}100%{transform:scale(1);opacity:0}}
  @keyframes jiggle{0%,100%{transform:translate(-50%,-50%) rotate(-4deg)}
                    50%{transform:translate(-50%,-50%) rotate(4deg) scale(1.06)}}
  @keyframes tryRun{0%,100%{transform:translate(0,0);opacity:0}
                    25%{transform:translate(34px,-4px);opacity:1}
                    55%{transform:translate(46px,0);opacity:1}
                    75%{transform:translate(6px,2px);opacity:.6}}
  .scanTxt{min-height:38px;line-height:1.6}
  .scanTxt b{display:block;font-size:14.5px;color:#5A0E14}
  .scanTxt small{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-top:3px}
  .bar{height:5px;background:#F3E3E4;border-radius:99px;overflow:hidden;margin-top:14px}
  .bar i{display:block;height:100%;width:0;background:var(--red);border-radius:99px;transition:width .5s ease}
  .big-score{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:0 0 4px}
  .big-score b{font-size:52px;color:var(--red)}
  .big-score span{font-size:13px;color:var(--mut)}
  /* 攤在沙發上的那一坨:分數越高融得越徹底(reduced-motion 會被關掉,靜態也看得出在攤) */
  .couch{position:relative;height:30px;margin:0}
  .couch .sofa{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:26px;line-height:1}
  .couch .blob{position:absolute;left:50%;bottom:11px;font-size:17px;line-height:1;
               transform:translateX(-50%);animation:melt 3.6s ease-in-out infinite}
  .couch.deep .blob{animation-duration:2.6s}
  .couch.light .blob{animation-duration:5s}
  @keyframes melt{
    0%,100%{transform:translateX(-50%) translateY(0)   rotate(-6deg) scaleY(1)}
    45%    {transform:translateX(-50%) translateY(9px)  rotate(-14deg) scaleY(.82) scaleX(1.12)}
    70%    {transform:translateX(-50%) translateY(12px) rotate(-18deg) scaleY(.74) scaleX(1.18)}}
  /* 戳章圖示:分數旁邊那顆會刺人的臉 */
  .stampi{font-size:40px!important;line-height:1;align-self:center}
  .stampT{display:inline-block;font-size:12px;font-weight:900;color:#A50011;background:#FFE9EB;
          border-radius:99px;padding:4px 12px}
  /* 跳過訪談時的一行:分數是純發票算的,不能讓他以為那兩題有算進去 */
  .skipnote{font-size:11px;font-weight:700;color:var(--mut);margin-top:6px}
  /* 分數 → 行動的因果句(0729):跟半徑同一區塊,不另外佔高度 */
  .cause{font-size:12px;font-weight:800;color:#A50011;background:#FFF1F2;border-radius:10px;
         padding:7px 10px;margin-top:7px;line-height:1.6}
  /* 訪談標題 */
  .lead{font-size:15px;font-weight:900;line-height:1.6;padding:14px 4px 0}
  .lead small{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-top:6px}
  /* 生活半徑:併進分數卡,不另開一張(0727 瘦身) */
  .radl{font-size:12.5px;font-weight:800;color:#3C4657;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
  .radl b{font-size:17px;color:#2B4BD7}
  .radl span{color:#7A8494}
  /* 發票證據:讓證據自己罵人 */
  .ev{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .ev:last-child{border-bottom:none;padding-bottom:2px}
  .ev{align-items:center}
  .ev .e{font-size:19px;line-height:1.3;flex:none}
  .ev b{display:block;font-size:13.5px;line-height:1.5;font-weight:800}
  /* 標題就是那句數字,不寫「發票怎麼說」這種說明語 */
  .evh{display:block;font-size:14.5px;font-weight:900;line-height:1.5;color:#5A0E14;margin-bottom:2px}
  /* 好去處列 */
  .subh{font-size:13px;font-weight:900;color:#5A0E14;margin:14px 4px 0}
  .subh small{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-top:4px;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:15px;padding:13px;margin-top:10px;box-shadow:0 2px 10px rgba(31,36,48,.06);cursor:pointer}
  .row .re{font-size:26px;flex:none;line-height:1.2}
  .row .rb{flex:1;min-width:0}
  .row .rb b{font-size:14px;font-weight:900;display:block}
  .row .rb .meta{font-size:11px;color:#7A8494;font-weight:700;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .row .rb i{display:block;font-style:normal;font-size:12px;line-height:1.65;color:#8A5A00;font-weight:800;margin-top:6px}
  .tag{font-size:10px;font-weight:900;background:#EDF1FE;color:#2B4BD7;border-radius:99px;padding:2px 7px}
  .tag.no{background:#F2F3F5;color:#8B96A3}
  /* 被拆穿那一行(只有回訪＋沒去才出現) */
  .busted{font-size:12px;font-weight:800;color:#A50011;background:#FFE9EB;border-radius:11px;
          padding:9px 12px;margin-top:8px;line-height:1.6}
  .rowbtn{flex:none;align-self:center;font-size:11.5px;padding:8px 9px}
  .spot{margin-top:10px}
  .spot .row{margin-top:0}
  /* 「全部」的分組標頭:來源要看得見,官方那組附可查連結 */
  .grp{font-size:12px;font-weight:900;color:#5A0E14;margin:16px 4px 2px}
  .grp small{display:block;font-size:10.5px;font-weight:700;color:var(--mut);margin-top:3px;line-height:1.6}
  .grp a{color:#2B4BD7}
  /* 篩選條:精選 / 我的清單 / 全部 —— 釘在標題列下面,清單隨時看得到。
     top 用 --topH(JS 量出來的標題列實高),因為那條有 safe-area,寫死會露餡。 */
  .fbar{display:flex;gap:7px;padding:10px 2px;margin:0 -2px;
        position:sticky;top:var(--topH,58px);z-index:8;background:var(--bg)}
  .fbar.stuck{box-shadow:0 6px 12px -8px rgba(31,36,48,.35)}
  .fbar .uk-chip{flex:1;text-align:center;font-size:12px;padding:9px 4px;min-height:44px}
  .fbar .uk-chip b{color:inherit}
  /* 出走計畫:最優順序 + 一鍵開地圖 + 到店報載具 */
  .plan{background:#fff;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(31,36,48,.06)}
  .plan h3{font-size:13.5px;font-weight:900;color:#5A0E14}
  .plan ol{margin:8px 0 0 18px;font-size:12.5px;line-height:2;color:#3C4657}
  .plan ol b{color:var(--ink)}
  .plan .tot{font-size:11.5px;color:var(--mut);font-weight:700;margin-top:6px}
  .plan .chain{font-size:11.5px;line-height:1.8;color:#8A5A00;font-weight:800;
               margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="top">
  <button onclick="nav.back()" aria-label="返回">&lsaquo;</button>
  <button class="ttl" onclick="goTop()" aria-label="回到第一頁">😶 無聊快篩</button>
  <span class="off">官方自營</span>
  <button onclick="shareNow()" aria-label="分享">&ctdot;</button>
</div>
<div class="wrap">

  <!-- v0 入口:一頁只有一個主 CTA。不放說明文字、不放隱私長註(0724 定調) -->
  <div id="v0">
    <div class="hero"><div class="big"><span class="face">😶</span></div>
      <h1>你的日子，規律到可以被預測</h1><p>你的發票已經寫好答案</p></div>
    <div id="lastBox"></div>
    <button class="btn p" id="cta" onclick="enter()">我敢測</button>
    <div class="sec" id="retest" style="display:none"><button onclick="retest()">重新驗一次</button></div>
  </div>

  <!-- v1 訪談:兩題都要答(落差不能靠預設值製造) -->
  <div id="v1" style="display:none">
    <div class="lead">先老實回答，等下發票會對答案
      <small>兩題，10 秒。答完才有資格喊冤。</small></div>
    <div class="card">
      <div class="q">Q1 · 週末你通常人在哪？</div>
      <div class="chips" data-chips="q1">
        <button class="uk-chip" data-v="home">家裡，躺著</button>
        <button class="uk-chip" data-v="alley">巷口那一圈</button>
        <button class="uk-chip" data-v="district">同一個商圈</button>
        <button class="uk-chip" data-v="roam">每週不同地方</button>
      </div>
      <div class="q">Q2 · 晚餐通常怎麼來？</div>
      <div class="chips" data-chips="q2">
        <button class="uk-chip" data-v="deliver">外送送來</button>
        <button class="uk-chip" data-v="conv">超商微波</button>
        <button class="uk-chip" data-v="same">巷口同一家</button>
        <button class="uk-chip" data-v="vary">到處吃或自己煮</button>
      </div>
    </div>
    <button class="btn p" id="goScan" onclick="scan()" disabled>先回答上面兩題</button>
    <div class="sec"><button onclick="skip()">懶得選，直接看結果</button></div>
  </div>

  <!-- v2 過場(transient:不入返回堆疊、可跳過) -->
  <div id="v2" style="display:none">
    <div class="card scan">
      <div class="radar">
        <span class="ring"></span><span class="ring r2"></span>
        <span class="dot">😶</span><span class="run">🚶</span>
      </div>
      <div class="scanTxt" id="scanTxt"><b>翻你的發票…</b></div>
      <div class="bar"><i id="scanBar"></i></div>
    </div>
    <div class="sec"><button onclick="skipScan()">跳過動畫 &rsaquo;</button></div>
  </div>

  <!-- v3 結果:一屏只給三件事——分數(帶戳章圖示)、發票證據一行一句、一顆主 CTA。
       分項與算式已移除(Robert 0727 拍板:一頁不給太多資訊) -->
  <div id="v3" style="display:none">
    <div class="uk-trend" id="trend" style="display:none"></div>
    <div class="card" style="text-align:center">
      <div class="couch" id="couch"><span class="sofa">🛋️</span><span class="blob" id="blob">🫠</span></div>
      <div class="big-score"><b id="scoreN">&mdash;</b><span>/100</span></div>
      <div class="stampT" id="stampT"></div>
      <div class="skipnote" id="skipnote" style="display:none">你沒回答，這是純發票版</div>
      <div class="radl">生活半徑 <b id="radN">&mdash;</b> · <span id="radTxt"></span></div>
      <!-- 0729:分數要接上行動誘因,不然使用者不知道 93 分能幹嘛 -->
      <div class="cause" id="cause"></div>
    </div>
    <div class="card">
      <b class="evh" id="evh">&mdash;</b>
      <div id="ev"></div>
    </div>
    <button class="btn p" id="rxCta" onclick="showRx()">你終於要出門了？</button>
    <div class="sec"><button onclick="shareNow()">曬我的無聊值</button></div>
  </div>

  <!-- v4 好去處:三個模式共用一頁(精選／我的清單／全部),篩選條釘在標題列下面。
       原本的 v5「全部好去處」併進來了——少一頁,清單永遠在同一個位置。 -->
  <div id="v4" style="display:none">
    <div class="subh" id="rxLead"><span id="rxLeadT">你終於要出門了？</span>
      <small></small></div>
    <div class="fbar" data-chips="mode">
      <button class="uk-chip on" data-v="pick">精選</button>
      <button class="uk-chip" data-v="mine">我的清單 <b id="mineN">0</b></button>
      <button class="uk-chip" data-v="all">全部</button>
    </div>
    <div id="planBox"></div>
    <div id="rxList"></div>
  </div>

  <!-- v7 空狀態(transient:一次性頁,有引導也有出路) -->
  <div id="v7" style="display:none">
    <div class="hero"><div class="big">🧾</div>
      <h1>你連發票都懶得存</h1><p>近 30 天只有 <b id="invN">0</b> 張&mdash;&mdash;連無聊都證明不了</p></div>
    <div class="card"><b style="font-size:13px">怎麼讓發票自己跑進來</b>
      <div style="font-size:12.5px;line-height:2;margin-top:6px">1️⃣ 結帳報手機條碼（載具）<br>2️⃣ 自動歸戶，不用拍不用存<br>3️⃣ 5 張就能開測</div></div>
    <button class="btn p" onclick="demoFill()">（示範）灌入發票，直接開測</button>
    <div class="sec"><button onclick="goCarrier()">看我的手機條碼</button></div>
  </div>

</div>
<script>
/* ==============================================================
   無聊快篩（bored）· 單元邏輯
   共用層一律走 UK.*(unit-kit.js)。不要改 unit-kit.js,也不要複製它的功能。

   這個單元的骨幹:發票 → 五個分項 → UK.data.composite() 出無聊值 →
   同一組數字同時長出「生活半徑」「證據行」「處方推薦理由」,所以三頁講的話對得起來。
   ============================================================== */
var UK_SLUG = 'bored';      /* 給 UK.exitToHome 的 postMessage 帶身分,殼才知道是誰要回首頁 */
var KEY = 'bored_state';
var ST  = UK.state.load(KEY);
var ANS = {};
var score = null;

/* ══ 文案挑選盤 ══════════════════════════════════════════════
   挑文案只改這三個數字,不用在檔案裡翻。每組的備選都在下面的陣列裡,
   索引超出範圍會自動退回第 0 句(不會空白)。

     push  出門刺激句 → v3 主 CTA + v4 標題        (PUSH,      5 句:0-4)
     evh   證據卡標題 · 說實話時                   (EVH,       5 句:0-4)
     liar  證據卡標題 · 被抓到說謊時               (EVH_LIAR,  3 句:0-2)
   ═══════════════════════════════════════════════════════════ */
var COPY = { push: 0, evh: 0, liar: 0 };

/* -- 兩題的答案:每一個選項都真的改分數(不是裝飾) -- */
var Q1 = {                                   /* 週末人在哪 → 生活半徑 */
  home:     { label: '家裡，躺著',     radius: 300  },
  alley:    { label: '巷口那一圈',     radius: 800  },
  district: { label: '同一個商圈',     radius: 2200 },
  roam:     { label: '每週不同地方',   radius: 6500 }
};
/* -- 出門刺激文案(Melon 0727:要帶刺激感,不是溫馨提示) --
   換句改最上面的 COPY.push,五句都留著讓 Robert 挑。
   用在:v3 的處方主 CTA、v4 的好去處標題(同一句,語氣才不會分岔)。 */
var PUSH = [
  '你終於要出門了？',                 /* 0 ← 目前用這句 */
  '離開這張椅子，半徑就會變',         /* 1 */
  '附近有東西，你只是沒去',           /* 2 */
  '你的圓，今天可以作廢',             /* 3 */
  '外送員今天不想見你'                /* 4 */
];
function push() { return PUSH[COPY.push] || PUSH[0]; }
/* -- 證據卡標題:要刺、要口語、數字要在句子裡 --
   換句改最上面的 COPY.evh / COPY.liar,其餘都留著讓 Robert 挑。
   s.n=近 30 天張數,s.conv=其中在超商的張數(會跟著發票變,不寫死)。 */
var EVH = [
  function (s) { return s.conv + ' 張發票長得一樣，你不膩我都膩了'; },      /* 0 ← 目前用這句 */
  function (s) { return '你的發票在重播，' + s.conv + ' 張同一集'; },        /* 1 */
  function (s) { return s.n + ' 張發票，' + s.conv + ' 張同一種店。膩了沒？'; }, /* 2 */
  function (s) { return s.conv + ' 張一模一樣，這叫習慣還是卡住？'; },       /* 3 */
  function (s) { return s.conv + ' 張同一種店，我幫你數的'; }               /* 4 */
];
/* 被抓到說謊時換這組(這一格本來就最好笑,別浪費) */
/* -- 掃描過場的台詞:主句戳他,小字補刀。四拍,每拍 620ms。
      要換整組就改 SCAN_SET(現在用第 0 組),不要只改一句,節奏會歪。 -- */
var SCAN = [
  [ ['翻你的發票…',        '47 張,翻得很快,因為都一樣'],
    ['定位中…',            '找不到,因為你沒動'],
    ['對你剛才的答案…',    '嗯哼'],
    ['量你的半徑…',        '尺不用拉太長'] ],
  [ ['吸入發票中…',        '一股超商味'],
    ['標記你的座標…',      '標一個點就夠了'],
    ['比對你剛才說的…',    '發票在笑'],
    ['算你的生活半徑…',    '算完會有點痛'] ],
  [ ['清點你的日常…',      '清單很短,別緊張'],
    ['畫你的活動範圍…',    '一個圈,收工'],
    ['查證你的說法…',      '查到了,不用查太久'],
    ['結算無聊值…',        '你確定要看?'] ]
];
var SCAN_SET = 0;

var EVH_LIAR = [
  function (s) { return '你嘴上這樣講，發票不是這樣寫'; },                  /* 0 ← 目前用這句 */
  function (s) { return '你剛才那句，' + s.conv + ' 張發票舉手反對'; },      /* 1 */
  function (s) { return '你說的版本，' + s.n + ' 張發票沒有一張同意'; }      /* 2 */
];

var Q2 = {                                   /* 晚餐怎麼來 → 外送依賴 */
  deliver: { label: '外送送來',         v: 96 },
  conv:    { label: '超商微波',         v: 88 },
  same:    { label: '巷口同一家',       v: 78 },
  vary:    { label: '到處吃或自己煮',   v: 34 }
};

/* -- 示範明細:kit 的 INV 只有張數與商家數,這裡把它拆成可吐槽的結構。
      全部以 UK.data.INV 當分母推導 → ?inv=N / 灌發票之後證據行會跟著變,不寫死 62%。 -- */
var RAW = { convRatio: .62, delivRatio: .19, newShops: 0, topShop: '全家', baseRadius: 1200 };
var _forceInv = 0;                  /* （示範）灌發票之後蓋掉 ?inv= */
function invN() { return _forceInv || UK.data.invCount(); }

function stats() {
  var n = invN(), inv = UK.data.INV;
  var conv = Math.round(n * RAW.convRatio), deliv = Math.round(n * RAW.delivRatio);
  var ans = curAns();
  return {
    n: n, conv: conv, deliv: deliv,
    convPct: n ? Math.round(conv / n * 100) : 0,
    shops: inv.d30.shops,
    d90n: inv.d90.n,
    streak: Math.min(21, Math.max(3, Math.round(n * .45))),
    newShops: RAW.newShops,
    topShop: RAW.topShop,
    radius: ans.q1 ? Q1[ans.q1].radius : RAW.baseRadius,
    askedRadius: !!ans.q1
  };
}
function radTxt(r) { return r >= 1000 ? (Math.round(r / 100) / 10) + ' 公里' : r + ' 公尺'; }

/* -- 五個分項:寫回 UK.data.POISON,總分仍由 UK.data.composite() 算。
      (kit 本來就設計成分項可被換掉——UK.data.load 接中台時做的是同一件事) -- */
function applyDims() {
  var s = stats(), ans = curAns();
  UK.data.POISON = [
    { k: 'conv',   nm: '🏪 超商佔比',   w: .25, v: clamp(Math.round(s.convPct * 1.32)) },
    { k: 'focus',  nm: '🐻 同店集中度', w: .25, v: clamp(Math.round(40 + s.streak * 2.3)) },
    { k: 'deliver',nm: '🛵 外送依賴',   w: .20,
      v: clamp(ans.q2 ? Q2[ans.q2].v : Math.round(45 + RAW.delivRatio * 180)) },
    { k: 'radius', nm: '📏 週末半徑',   w: .20, v: clamp(Math.round(100 - Math.min(93, s.radius / 70))) },
    { k: 'fresh',  nm: '🆕 新店嘗試',   w: .10, v: clamp(95 - s.newShops * 18) }
  ];
  return s;
}
function clamp(v) { return Math.max(2, Math.min(98, v || 0)); }
function curAns() { return Object.keys(ANS).length ? ANS : (ST.ans || {}); }

/* ══ 沒去偵測 ══════════════════════════════════════════════
   上次按了「帶你衝」,這次回來發票張數一張都沒多 → 他沒去。
   兩個都是事實(存的 pick + 發票數),所以不用寫「你很懶」,把兩件事並排就夠痛。
   只在「上一個 session 排的」才算 —— 剛按下去馬上罵人會像壞掉。 */
var _sessionStart = Date.now();
function placeName(k) {
  var sp = SPOTS.filter(function (p) { return p.k === k; })[0];
  return sp ? sp.name : k;
}
function noShow() {
  var picks = ST.picks || {}, keys = Object.keys(picks);
  if (!keys.length) return null;
  if (typeof ST.pickAt !== 'number' || ST.pickAt >= _sessionStart) return null;  /* 同一次造訪不算 */
  if (ST.pickInv !== invN()) return null;                                        /* 發票有多 → 可能真的去了 */
  return { k: keys[keys.length - 1], name: placeName(keys[keys.length - 1]), n: keys.length };
}

/* 返回堆疊:v2 過場、v7 空狀態不入堆疊(這是 kit 幫你處理好的坑) */
var VIEWS = ['v0','v1','v2','v3','v4','v7'];   /* 原 v5「全部好去處」已併進 v4 的篩選條 */
var nav = UK.nav.create({
  views: VIEWS,
  transient: ['v2','v7'],
  render: function (v) {
    VIEWS.forEach(function (id) {
      document.getElementById(id).style.display = (id === v) ? '' : 'none';
    });
    window.scrollTo(0, 0);
  },
  /* 不傳 onHome:嵌在殼/App 裡 kit 會 postMessage 關 webview,單機直開會導回載具首頁。
     這裡寫 toast 反而會把閉環變成死路。 */
  sheets: function () { return [function () { return UK.closeTopSheet(); }]; }
});

/* -- 入口:回訪態 + 空狀態門檻 -- */
function entryRender() {
  var box = document.getElementById('lastBox'), cta = document.getElementById('cta'),
      re = document.getElementById('retest'), hero = document.querySelector('#v0 .hero');
  if (typeof ST.n === 'number') {
    var ns = noShow();
    box.innerHTML = UK.state.lastBox({ label:'上次無聊值', n:ST.n, unit:'/100', at:ST.mat, prev:ST.prev, onclick:"showResult()" })
      /* 回訪才有的一行。新用戶的入口仍然只有臉＋一句＋一顆鈕(0724 定調) */
      /* 只講事實(發票沒多),不替他下結論——「不明說」比「說你沒去」更刺,也不會講得比資料多 */
      + (ns ? '<div class="busted">上次你說要衝「' + ns.name + '」。發票一張都沒多。</div>' : '');
    cta.textContent = ns ? '那再測一次好了' : '看我的結果';
    cta.setAttribute('onclick', ns ? 'retest()' : 'showResult()');

    document.querySelector('#retest button').textContent = ns ? '看上次的結果' : '重新驗一次';
    document.querySelector('#retest button').setAttribute('onclick', ns ? 'showResult()' : 'retest()');
  } else {
    box.innerHTML = ''; cta.textContent = '我敢測'; cta.setAttribute('onclick', 'enter()');
    re.style.display = 'none'; hero.classList.remove('mini');
  }
}
function enter() {
  if (invN() < UK.data.MIN_INV) {
    document.getElementById('invN').textContent = invN();
    nav.show('v7'); return;
  }
  resetAns(); nav.show('v1'); UK.track('bored_start');
}
/* 重測的嘲諷會累加:同一組發票按第 N 次,話越難聽(數字本來就不會變) */
var RETEST = [
  '同一組發票，你想要什麼不一樣的答案？',
  '第 3 次了。多按幾次不會變低。',
  '你在等奇蹟嗎',
  '你這樣按，比出門還久'
];
function retest() {
  ST.retests = (ST.retests || 0) + 1; ST = UK.state.save(KEY, ST);
  UK.toast(ST.retests <= 1 ? '你的發票這 30 天沒有新增，數字不會變'
                           : (RETEST[Math.min(ST.retests - 2, RETEST.length - 1)]));
  resetAns(); nav.show('v1'); UK.track('bored_retest', { times: ST.retests });
}
/* 灌發票要蓋掉 ?inv=（不然證據行還在用 2 張算,說「已灌入」就是騙人） */
function demoFill() {
  UK.data.INV.d30.n = 47; _forceInv = 47;
  UK.toast('（示範）已灌入發票'); resetAns(); nav.show('v1');
}
/* 條碼不用把人踢回首頁了:kit 的 UK.carrier 會畫真的 Code 39(掃得出來)。
   店員掃完 → 發票進來 → 就能開測,示範時這條迴圈是閉的。 */
function goCarrier() {

}
/* 點標題上的 😶 = 回第一頁,並清掉堆疊(不是往回一層) */
function goTop() {
  if (nav.current() === 'v0') { window.scrollTo(0, 0); return; }
  UK.closeTopSheet(); nav.reset('v0'); UK.track('go_top');
}
/* 分享出去的連結不帶 ?inv= / ?demo= 這些開發參數 */
function shareLink() { return location.origin + location.pathname; }
/* ⋯ = 直接分享,不走選單。
   為什麼不用 UK.menu:它的「📤 分享」是純文字連結分享(navigator.share 的 title/text/url),
   在不支援的環境會靜默掉回「複製連結」——使用者按了分享卻只拿到一段網址。
   這顆單元有更好的東西:UK.share 的 4:5 圖卡(圖內有 QR),share 失敗會退成下載圖檔,
   兩條路都是「真的分享出去」。測過還沒測的都不會變成複製連結。 */
function shareNow() {
  if (typeof score !== 'number') { UK.toast('先測一次,才有東西可以曬'); return; }
  UK.track('bored_share_click', { score:score, radius:stats().radius, from:nav.current() });
  UK.share.open(card);
}
/* 原生分享面板的文字(UK.share.send 會用 card().text,這支留給需要純文字時用) */
function shareMeta() {
  var s = stats();
  return { title: '無聊快篩',
           text: (typeof score === 'number' ? '我的無聊值 ' + score + '，生活半徑 ' + radTxt(s.radius) + '。' : '')
                 + (EVH[COPY.evh] || EVH[0])(s) };
}

/* -- 訪談:兩題都要答才能往下 -- */
function resetAns() {
  ANS = {};
  /* 只清訪談那兩組——不要連篩選條的選中態一起清掉(它不是答案) */
  document.querySelectorAll('[data-chips="q1"] [data-v],[data-chips="q2"] [data-v]')
    .forEach(function (c) { c.classList.remove('on'); });
  gate();
}
function gate() {
  var need = 2 - Object.keys(ANS).length, b = document.getElementById('goScan');
  b.disabled = need > 0;
  b.textContent = need >= 2 ? '先回答上面兩題' : (need === 1 ? '還有 1 題' : '好了，驗我的發票');
}
UK.chips.bind(document, { onPick: function (k, v, cleared) {
  /* 篩選條跟訪談共用 kit 的 chips,要先攔下來——不然它會被當成第三個答案,把門檻算壞 */
  if (k === 'mode') {
    RXMODE = cleared ? 'pick' : v;                 /* 再點一次同一顆 = 回精選 */
    markMode(RXMODE);
    renderRx();
    UK.track('rx_mode', { mode:RXMODE, n:pickedSpots().length });
    return;
  }
  if (cleared) delete ANS[k]; else ANS[k] = v;
  gate();
} });
/* 篩選條的選中態:離開「我的清單」時要把亮起來的那顆收回 */
function markMode(v) {
  document.querySelectorAll('[data-chips="mode"] [data-v]').forEach(function (c) {
    c.classList.toggle('on', c.getAttribute('data-v') === v);
  });
}
function skip() { ANS = {}; ST.ans = {}; scanRun(true); }

/* -- 掃描過場(可跳過;timer 會清掉,不會晚一步又跳) -- */
var _t = [];
function scan() { scanRun(false); }
function scanRun(skipped) {
  nav.show('v2');
  var steps = SCAN[SCAN_SET] || SCAN[0], i = 0;
  var el = document.getElementById('scanTxt'), bar = document.getElementById('scanBar');
  var s = stats();
  function paint(n) {
    var line = steps[n];
    /* 第一句把張數帶進去(數字要是他自己的,不然只是裝飾) */
    var sub = (n === 0) ? (s.n + ' 張,翻得很快,因為都一樣') : line[1];
    el.innerHTML = '<b>' + line[0] + '</b><small>' + sub + '</small>';
    bar.style.width = Math.round((n + 1) / steps.length * 100) + '%';
  }
  paint(0);
  _t = [];
  var h = setInterval(function () {
    i++;
    if (i < steps.length) paint(i);
    else { clearInterval(h); finish(skipped); }
  }, 620);
  _t.push(function () { clearInterval(h); });
  _skipped = skipped;
}
var _skipped = false;
function skipScan() { _t.forEach(function (f) { f(); }); _t = []; finish(_skipped); }

function finish(skipped) {
  applyDims();
  var next = UK.data.composite();                 /* 分數由分項算出來,不寫死 */
  var prev = (typeof ST.n === 'number' && ST.n !== next) ? ST.n : ST.prev;
  score = next;
  ST.n = score; ST.prev = prev; ST.ans = ANS; ST.skipped = !!skipped;
  ST.inv = invN(); ST.mat = Date.now();
  ST = UK.state.save(KEY, ST);
  entryRender(); showResult();
  UK.track('bored_result', { score: score, radius: stats().radius, skipped: !!skipped });
}

function showResult() {
  var s = applyDims(), live = UK.data.composite(), ans = curAns();
  /* 發票變了(?inv= / 灌發票)就以新算的為準,並把舊值留成趨勢——不要讓兩頁的數字打架 */
  if (typeof ST.n === 'number' && ST.n !== live) {
    ST.prev = ST.n; ST.n = live; ST.inv = invN(); ST = UK.state.save(KEY, ST); entryRender();
  }
  score = live;
  document.getElementById('scoreN').textContent = score;
  var t = document.getElementById('trend'), html = UK.state.trendHTML(score, ST.prev);
  t.innerHTML = html; t.style.display = html ? '' : 'none';
  /* 分數旁邊那顆圖示 + 一個戳章詞:越無聊越像家具 */
  var tier = score >= 85 ? { i:'🛋️', t:'和沙發長在一起' }
           : score >= 70 ? { i:'😶', t:'可預測' }
           : score >= 50 ? { i:'🙃', t:'有點悶' }
                         : { i:'🚶', t:'還有救' };
  document.getElementById('stampT').textContent = tier.i + ' ' + tier.t;
  /* 沙發上那一坨:分數越高融得越快、越扁 */
  var couch = document.getElementById('couch');
  couch.className = 'couch ' + (score >= 85 ? 'deep' : (score >= 70 ? '' : 'light'));
  document.getElementById('blob').textContent = score >= 85 ? '🫠' : (score >= 50 ? '😪' : '🙂');
  document.getElementById('skipnote').style.display = ST.skipped ? '' : 'none';
  /* 0729:講清楚這個數字能幹嘛 —— 出門一趟、發票進來,分項就會動,數字自己會掉。
     不承諾具體掉幾分(那要真發票回來才算得出來),只講因果方向。 */
  document.getElementById('cause').textContent = '出門刷一次載具，這個數字就會往下掉';

  /* 生活半徑(併在分數卡裡,一行講完) */
  document.getElementById('radN').textContent = radTxt(s.radius);
  document.getElementById('radTxt').textContent = radLine(s);
  document.getElementById('rxCta').textContent = push();

  /* 標題:被抓到說謊換另一組,其餘用刺人那句(數字都在句子裡) */
  document.getElementById('evh').textContent = (!ST.skipped && mismatch(s, ans))
    ? (EVH_LIAR[COPY.liar] || EVH_LIAR[0])(s)
    : (EVH[COPY.evh] || EVH[0])(s);

  /* 證據:一行一句,不再帶灰色小字(一句話罵完) */
  document.getElementById('ev').innerHTML = evidence(s, ans).map(function (l) {
    return '<div class="ev"><span class="e">' + l.e + '</span><div><b>' + l.t + '</b></div></div>';
  }).join('');
  nav.show('v3');
}
/* 分項與算式頁已移除(Robert 0727 拍板)。分數本身還是 UK.data.composite() 算出來的,
   要復原的話:v6 一頁 + 一顆文字連結,算式取 UK.data.formula() 的 total/max/avg。 */

function radLine(s) {                        /* 一句話,不解釋(0727 瘦身) */
  if (s.radius < 500)  return '外送員的機車比你有見識';
  if (s.radius < 1000) return '樓下就是你的遠方';
  if (s.radius < 3000) return '一個商圈就是你的國境';
  return '會動，但去的還是那幾家';
}
function mismatch(s, ans) {
  return (ans.q1 === 'roam' && s.newShops === 0) || (ans.q2 === 'vary' && s.convPct >= 50);
}
/* 證據行:一行一句,句子裡自己帶數字。不寫「你很無聊」,也不再補灰色說明。
   固定最多 5 行 —— 行數會變的話,主 CTA 就會被擠出首屏(說謊時本來會變 7 行)。
   排序就是優先序:被抓到說謊的那兩行最好笑,所以排在前面,擠掉後面比較弱的。 */
/* 0729:分數卡多了因果句,證據行從 5 收到 4,主 CTA 才留在首屏。
   排序本來就是優先序,被擠掉的是最弱的那一行(通常是 🆕 或 🛵)。 */
var EV_MAX = 4;
function evidence(s, ans) {
  var L = [];
  /* 沒去的那行最痛,排第一 —— 它是「你自己說的」對上「發票沒動」 */
  var ns = noShow();
  if (ns) L.push({ e:'🫥', t:'你說要衝「' + ns.name + '」，之後 0 張新發票' });
  L.push({ e:'🏪', t:'人生的 ' + s.convPct + '% 在超商結帳' });
  L.push({ e:'🐻', t:'同一家' + s.topShop + '連續 ' + s.streak + ' 天，店員比你朋友熟你' });
  if (ans.q1 === 'roam' && s.newShops === 0)
    L.push({ e:'🙃', t:'你說「每週不同地方」，發票沒看到' });
  if (ans.q2 === 'vary' && s.convPct >= 50)
    L.push({ e:'🙃', t:'你說「到處吃」，' + s.conv + ' 張超商發票舉手' });
  /* 半徑的吐槽在分數卡,這裡只給數字;「只」不能亂用,6.5 公里說「只」就變假話 */
  L.push({ e:'📏', t:'週末' + (s.radius < 1000 ? '只移動 ' : '平均移動 ') + radTxt(s.radius) });
  if (s.deliv > 0) L.push({ e:'🛵', t:'這個月最常見到你的人：外送員' });
  L.push({ e:'🆕', t:'新店嘗試 ' + s.newShops + ' 家，勇氣同分' });
  return L.slice(0, EV_MAX);
}

/* ── 好去處:只有景點,一列一個(0728 拍板砍掉餐廳那段) ──
   推薦理由(why)綁回發票證據,所以會隨半徑/連續天數變動;不做 LBS 排序(只用靜態距離)。
   註:合作商家導流(UK.shops + 「這附近可以吃」展開區)整段移除。要接回來的話,
   kit 的 UK.shops 還在:列上加 data-shop,地點卡的 CTA 會自動變成「看菜單」直達點餐頁。 */
/* 來源註冊表:每個景點都要說得出「憑什麼推薦你去」。
   官方那組是真的可查(2026-07 查證);在地／社群那組是示範資料,不冒充官方——
   口徑鐵律的同一個原則:要標來源就標得出來,標不出來就說是示範。 */
var SOURCES = {
  gov:   { tag:'🏛️ 100 亮點', name:'2026-2027 台灣觀光100亮點', by:'交通部觀光署',
           note:'中央與地方推薦＋百萬民眾票選',
           url:'https://spotlightaward.taiwan.net.tw/spotlight_n.php', at:'2026-07 查證' },
  local: { tag:'💬 在地推薦',  name:'在地與社群分享的去處',       by:'示範資料',
           note:'正式版接社群熱度與縣市觀光局清單', url:'', at:'' }
};
/* 距離是從板橋府中一帶抓的直線距離,示範用。正式版用中台給的座標算。 */
var SPOTS = [
  { k:'linpark',  src:'local', emoji:'🌳', name:'府中商圈 · 林本源園邸', km:1.3, q:'林本源園邸',
    why:function(s){ return '1.3 公里，比你週末的 ' + radTxt(s.radius) + '多一點——今天先破這個'; } },
  { k:'nancun',   src:'local', emoji:'🏘️', name:'四四南村',             km:7.6, q:'四四南村',
    why:function(s){ return '走完等於你這個月的移動總量'; } },
  { k:'ntcart',   src:'gov',   emoji:'🖼️', name:'新北市美術館（鶯歌）', km:8.0, q:'新北市美術館',
    why:function(s){ return '新店嘗試 ' + s.newShops + ' 家。這裡連館都是新的'; } },
  { k:'dadaocheng',src:'gov',  emoji:'🏮', name:'大稻埕',               km:8.5, q:'大稻埕',
    why:function(s){ return '官方票選出來的地方,你 90 天內一張發票都沒留在那'; } },
  { k:'hushan',   src:'local', emoji:'⛰️', name:'虎山親山步道',         km:9.5, q:'虎山親山步道',
    why:function(s){ return '外送員這個月見你 ' + s.deliv + ' 次，山一次都沒見過你'; } },
  { k:'songshan', src:'gov',   emoji:'🎨', name:'松山文創園區',         km:12.0, q:'松山文創園區',
    why:function(s){ return '你的圓是 ' + radTxt(s.radius) + '，這裡 12 公里。捷運就到'; } },
  { k:'maokong',  src:'gov',   emoji:'🍃', name:'貓空',                 km:16.0, q:'貓空纜車',
    why:function(s){ return '纜車上去,連走路都不用——你連這樣都不去?'; } },
  { k:'tamsui',   src:'gov',   emoji:'⛵', name:'淡水漁人碼頭',         km:24.0, q:'淡水漁人碼頭',
    why:function(s){ return '24 公里。你這個月的移動總量還不到它的一半'; } },
  { k:'wulai',    src:'gov',   emoji:'🚞', name:'烏來台車',             km:28.0, q:'烏來台車',
    why:function(s){ return '你的紀錄是 ' + radTxt(s.radius) + '。28 公里,一次作廢'; } }
];

/* 傳給 UK.poi 的字典(kit 的 bind 介面不動,只在 init 呼叫一次) */
var POI = {};
SPOTS.forEach(function (p) {
  POI[p.k] = { emoji:p.emoji, name:p.name, q:p.q, why:'', info:'',
    addLabel:'🧾 發票載具帶你衝', onAdd:function (vf, row) { togglePick(vf, row); } };
});

function spotsSorted() { return SPOTS.slice().sort(function (a, b) { return a.km - b.km; }); }

/* 精選:挑「在你的圓外面」的,近的先 —— 0729 Rebecca 走查修正。
   原本固定給 3 個最近的,對半徑大的人(=無聊值低=機動性高)等於推薦他早就去過的範圍,
   而且還標「這 3 個都在圓外」——半徑 6.5 公里的人看到 1.3 公里的景點,那句是假的。
   低分的人最該被推薦驅動(想出門、只缺新地點),所以要給他圓外的。
   圓外不足 3 個才用圓內的補(遠的先),沒有人會被擋掉。 */
function featured(s) {
  var all = spotsSorted();
  var out = all.filter(function (p) { return p.km * 1000 > s.radius; });
  if (out.length >= 3) return out.slice(0, 3);
  var inside = all.filter(function (p) { return p.km * 1000 <= s.radius; })
                  .sort(function (a, b) { return b.km - a.km; });   /* 圓內的話,遠的先 */
  return out.concat(inside).slice(0, 3);
}

/* 景點卡:一列 = emoji + 名字 + 距離 + 一句理由 + 一顆「帶你衝」 */
function spotHTML(p, s) {
  var why = p.why(s);
  var src = SOURCES[p.src] || SOURCES.local;
  POI[p.k].why = why;
  /* 地點卡把來源講完:名稱、誰推的、什麼時候查的。標不出來的就不標。 */
  POI[p.k].info = '距離 ' + p.km + ' 公里　·　' + src.name
                + '（' + src.by + (src.at ? '，' + src.at : '') + '）';
  var picked = (ST.picks || {})[p.k];
  var ns = noShow();
  var busted = ns && ns.k === p.k;                     /* 上次排的就是這個景點 */
  return '<div class="spot">'
    + '<div class="row" data-poi="' + p.k + '" role="button" tabindex="0">'
    + '<span class="re">' + p.emoji + '</span>'
    + '<div class="rb"><b>' + p.name + '</b>'
    + '<div class="meta"><span>' + p.km + ' 公里</span>'
    + '<span class="tag' + (p.src === 'gov' ? '' : ' no') + '">' + src.tag + '</span>'
    + (busted ? '<span class="tag no">上次你說要來</span>' : '') + '</div>'
    + '<i>' + why + '</i></div>'
    + '<button class="uk-vf rowbtn' + (picked ? ' done' : '') + '" data-label="帶你衝">'
    + (picked ? '✅ 已排入' : '帶你衝') + '</button>'
    + '</div></div>';
}
function togglePick(vf, row) {
  if (!vf) return;
  var k = row.getAttribute('data-poi'), picks = ST.picks || {};
  var label = vf.getAttribute('data-label') || '帶你衝';
  if (picks[k]) { delete picks[k]; vf.classList.remove('done'); vf.textContent = label; }
  else { picks[k] = 1; vf.classList.add('done'); vf.textContent = '✅ 已排入';
         UK.toast('排進出走清單了——別又滑掉'); }
  /* 記下「什麼時候排的」與「當時幾張發票」——下次回來就是用這兩個數字拆穿他 */
  ST.picks = picks; ST.pickAt = Date.now(); ST.pickInv = invN();
  ST = UK.state.save(KEY, ST);
  UK.track('rx_pick', { poi:k, on:!!picks[k] });
  /* 0729 主訊號:加入收藏／行程(只在「加入」時送,取消不算) */
  if (picks[k]) {
    var sp = SPOTS.filter(function (x) { return x.k === k; })[0] || {};
    UK.track('bored_save_click', { poi:k, src:sp.src || '', km:sp.km || 0,
                                   total:Object.keys(picks).length, score:score });
  }
  /* 清單數字與「我的清單」內容要當場跟著動(在 v4 才需要重畫) */
  if (nav.current() === 'v4') renderRx();
}
/* ══ 出走計畫(我的清單)═════════════════════════════════════
   排入 → 看得到清單 → 由近到遠的順序 → 一鍵開 Google 地圖 → 到店報載具 → 發票回來。
   路線順序用距離排(由近到遠),不假裝是 Google 的最佳化演算法——Maps 的 URL API
   沒有 optimize 參數,講「最優」就是騙人。地圖那一鍵是真的帶著全部站點開出去。 */
var RXMODE = 'pick';                              /* pick | mine */
function pickedSpots() {
  var picks = ST.picks || {};
  return spotsSorted().filter(function (p) { return picks[p.k]; });
}
function mapsRouteURL(list) {
  if (!list.length) return null;
  var qs = list.map(function (p) { return encodeURIComponent(p.q); });
  var dest = qs.pop();
  var u = 'https://www.google.com/maps/dir/?api=1&destination=' + dest + '&travelmode=driving';
  if (qs.length) u += '&waypoints=' + qs.join('%7C');
  return u;
}
function openRoute() {
  var list = pickedSpots(); if (!list.length) return;
  UK.track('plan_route', { n:list.length });
  /* 0729 主訊號:真的點了導航。刷載具只是輔助(發票有時間落差,不能當即時或必要條件) */
  UK.track('bored_map_click', { n:list.length, km:Math.round(list.reduce(function (a, p) { return a + p.km; }, 0) * 10) / 10,
                                radius:stats().radius, score:score });
  window.open(mapsRouteURL(list), '_blank');
}
function planCarrier() {
  UK.carrier.open({ from:'plan', onDone: function () {
    UK.toast('這筆會進你的載具——下次進來無聊值就會動');
  } });
}
function planHTML(s) {
  var list = pickedSpots();
  if (!list.length) {
    return '<div class="plan"><h3>清單是空的</h3>'
      + '<div class="chain" style="border:none;padding:0;margin-top:6px">'
      + '你連想去哪都還沒決定。回「精選」按一下「帶你衝」。</div></div>';
  }
  var tot = list.reduce(function (a, p) { return a + p.km; }, 0);
  return '<div class="plan">'
    + '<h3>🗺️ 由近到遠,這樣走</h3>'
    + '<ol>' + list.map(function (p) {
        return '<li><b>' + p.name + '</b>　' + p.km + ' 公里</li>'; }).join('') + '</ol>'
    + '<div class="tot">' + list.length + ' 站 · 直線距離合計 ' + (Math.round(tot * 10) / 10)
    + ' 公里 · 你的半徑是 ' + radTxt(s.radius) + '</div>'
    + '<div class="chain">到了之後:結帳報手機條碼 → 發票自動歸戶 → 下次進來這裡的數字會動。'
    + '<br>這就是我們要的那條鏈:出門 → 消費 → 發票 → 再被戳一次。</div>'
    + '</div>'
    + '<button class="btn p" onclick="openRoute()">🧭 Google map 帶你去</button>'
    /* 反諷版:不講功能(降低無聊值),講他不做的後果——沒刷就等於沒去過 */
    + '<div class="sec"><button onclick="planCarrier()">刷載具，不然誰知道你去過？</button></div>';
}

function renderRx(s) {
  s = s || applyDims();
  var mine = pickedSpots(), all = spotsSorted();
  document.getElementById('mineN').textContent = mine.length;
  var list = RXMODE === 'mine' ? mine : (RXMODE === 'all' ? all : featured(s));
  document.getElementById('planBox').innerHTML = (RXMODE === 'mine') ? planHTML(s) : '';
  /* 「全部」按來源分組,官方那組附可查的連結;其他模式不分組(混著看比較像處方) */
  document.getElementById('rxList').innerHTML = (RXMODE === 'all')
    ? ['gov', 'local'].map(function (key) {
        var g = list.filter(function (p) { return (p.src || 'local') === key; });
        if (!g.length) return '';
        var src = SOURCES[key];
        return '<div class="grp">' + src.tag + ' ' + src.name
             + '<small>' + src.by + ' · ' + src.note + (src.at ? ' · ' + src.at : '')
             + (src.url ? ' · <a href="' + src.url + '" target="_blank" rel="noopener">看名單</a>' : '')
             + '</small></div>'
             + g.map(function (p) { return spotHTML(p, s); }).join('');
      }).join('')
    : list.map(function (p) { return spotHTML(p, s); }).join('');
  /* 圓外幾個就講幾個,不要一律說「都在圓外」——半徑大的人會抓到這句是假的 */
  var outN = list.filter(function (p) { return p.km * 1000 > s.radius; }).length;
  document.querySelector('#rxLead small').textContent =
      RXMODE === 'mine' ? (mine.length ? '排了 ' + mine.length + ' 個地方。走不走是你的事。' : '還沒排任何地方')
    : RXMODE === 'all'  ? all.length + ' 個地方,自己挑'
    : '半徑 ' + radTxt(s.radius) + ' · ' + (outN === list.length
        ? '這 ' + list.length + ' 個都在圓外' : outN + ' 個在圓外');
}
function showRx() {
  var s = applyDims();
  document.getElementById('rxLeadT').textContent = push();
  renderRx(s);
  nav.show('v4'); UK.track('rx_view', { radius:s.radius, mode:RXMODE });
  /* 0729 成功訊號:看到推薦清單(主訊號是 map/save,這個是分母) */
  UK.track('bored_reco_view', { mode:RXMODE, n:document.querySelectorAll('#rxList .spot').length,
                                radius:s.radius, score:score });
}
/* 「全部」不再是獨立頁,是 v4 的一個模式(留這支是為了外部呼叫不斷掉) */
function showAll() { RXMODE = 'all'; markMode('all'); showRx(); }

/* -- 分享卡:一張圖 + 圖內 QR(kit 負責畫) -- */
function card() {
  var s = stats();
  return {
    theme: 'bored', emoji: '😶', sub: '無聊值 ' + score + '／100', tint: '生活半徑 ' + radTxt(s.radius),
    score: score, unitTxt: '/100',
    head: '😶 無聊快篩',
    /* 圖上那句用「照你這個X法,你很快就要Y了」的句型(Robert 0728 指定的形狀)。
       主題要對得上這顆單元——這裡量的是無聊,不是花錢,所以不寫「照你這個花法」。 */
    punch: score >= 85 ? '照你這個活法，你很快就要跟沙發長在一起了'
         : score >= 70 ? '照你這個活法，下週的你跟這週一模一樣'
         :               '照你這個活法，至少還有得救',
    stamp: score >= 85 ? '可預測' : (score >= 70 ? '超穩定' : (score >= 50 ? '有點悶' : '還有救')),
    qrHint: '掃碼，驗你自己的圓',
    title: '我的無聊快篩',
    text: '我的無聊值 ' + score + '，生活半徑 ' + radTxt(s.radius) + '。' + (EVH[COPY.evh] || EVH[0])(s) + ' 你呢？',
    url: location.origin + location.pathname
  };
}

/* -- init -- */
UK.poi.bind(POI);                    /* 整列可點 → 地點卡;按鈕區不觸發 */
document.addEventListener('click', function (e) {     /* 列上的按鈕自己接(kit 只管開地點卡) */
  if (!e.target.closest) return;
  var btn = e.target.closest('.uk-vf');
  if (!btn) return;
  var row = btn.closest('[data-poi]');
  if (row) togglePick(btn, row);
});
document.addEventListener('keydown', function (e) {   /* 列是 role=button,鍵盤也要能開 */
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var row = e.target.closest && e.target.closest('[data-poi]');
  if (!row || e.target.tagName === 'BUTTON') return;
  e.preventDefault(); UK.poi.open(row, POI);
});
/* 篩選條要黏在標題列正下方。標題列有 safe-area,高度會變,所以量出來寫進 --topH;
   轉向或字級變化時重量一次。 */
function syncTopH() {
  var t = document.querySelector('.top');
  if (t) document.documentElement.style.setProperty('--topH', Math.round(t.getBoundingClientRect().height) + 'px');
}
syncTopH();
window.addEventListener('resize', syncTopH);
window.addEventListener('orientationchange', syncTopH);
/* 黏住的時候補一道陰影,讓下面的卡看起來是從它底下滑過去 */
window.addEventListener('scroll', function () {
  var f = document.querySelector('.fbar');
  if (!f) return;
  var top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--topH')) || 58;
  f.classList.toggle('stuck', f.getBoundingClientRect().top <= top + 1);
}, { passive: true });

applyDims();
entryRender();
nav.reset('v0');
UK.applyDemoMode(document.body);
UK.homeHint();          /* 單機直開時顯示「從發票載具首頁進入」的正規路徑 */
UK.track('bored_view');
/* 開發時在 console 打 UK.selfCheck() 做機械自檢 */
</script>
</body>
</html>
